[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/widellt/sunlyt"
rust-version = "1.95"

[workspace.dependencies]
sunlyt-core = { path = "crates/core" }
sunlyt-viewer = { path = "crates/viewer" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
glam = "0.29"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rayon = "1"
tobj = { version = "4", default-features = false, features = ["use_f64"] }
toml = "0.8"
