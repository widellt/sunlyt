# Panel sandbox: one 6 × 8 grid of IMM-α cells in six 8-cell strings, with a
# small instrument box casting a shadow across part of it. Open it with
#   sunlyt sandbox examples/sandbox/sandbox.toml
# Every key is explained in docs/guide/sandbox.md.
samples = 4                 # 4 × 4 shadow rays per cell
size = [0.52, 0.36]         # substrate (u, v), metres

[panel]                     # the keys of a scene's [[panel]]
rows = 8                    # along v
cols = 6                    # along u
cell = [0.08, 0.04]
gap = [0.002, 0.002]
strings = { series = 8 }    # walks the rows back and forth: 6 strings

[sun]
azimuth_deg = 200           # from +u towards +v
elevation_deg = 50          # above the panel

[[box]]                     # an instrument standing off the panel
centre = [-0.08, -0.05, 0.14] # (u, v, height), metres
size = [0.10, 0.06, 0.08]
rotation_deg = 15           # about the panel normal

[electrical]
cell = "solaero-imm-alpha"
temperature_c = 60.0
regulation = "fixed-bus"
bus_v = 28.0
