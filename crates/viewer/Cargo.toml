[package]
name = "sunlyt-viewer"
description = "Interactive 3D viewer of the sunlyt spacecraft solar-array power simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sunlyt-core.workspace = true
anyhow.workspace = true
rayon.workspace = true
chrono.workspace = true
glam.workspace = true
serde.workspace = true
toml.workspace = true
arc-swap = "1"
png = "0.18"
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
egui_plot = "0.38"
