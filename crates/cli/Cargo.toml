[package]
name = "sunlyt"
description = "Command-line front end of the sunlyt spacecraft solar-array power simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sunlyt-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
glam.workspace = true
clap.workspace = true
toml.workspace = true
sunlyt-viewer = { workspace = true, optional = true }

[features]
default = ["viewer"]
# The interactive viewer (`sunlyt view`): pulls in eframe/wgpu. Build with
# --no-default-features for a headless CLI.
viewer = ["dep:sunlyt-viewer"]
